name: Build and Push Images

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'frontend/**'
      - '.github/workflows/**'

env:
  OKTETO_TOKEN: ${{ secrets.OKTETO_TOKEN }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Okteto CLI
      uses: okteto/setup@latest
      with:
        token: ${{ secrets.OKTETO_TOKEN }}

    - name: Login to Okteto Registry
      run: okteto registry login

    - name: Build and push API image
      run: |
        echo "🚀 Building and pushing API image..."
        cd api
        docker build -t okteto/movies-with-helm:api .
        docker tag okteto/movies-with-helm:api okteto/movies-with-helm:api-${{ github.sha }}
        docker push okteto/movies-with-helm:api
        docker push okteto/movies-with-helm:api-${{ github.sha }}
        echo "✅ API image build and push completed"

    - name: Build and push Frontend image
      run: |
        echo "🚀 Building and pushing Frontend image..."
        cd frontend  
        docker build -t okteto/movies-with-helm:frontend .
        docker tag okteto/movies-with-helm:frontend okteto/movies-with-helm:frontend-${{ github.sha }}
        docker push okteto/movies-with-helm:frontend
        docker push okteto/movies-with-helm:frontend-${{ github.sha }}
        echo "✅ Frontend image build and push completed"

    - name: Validate images
      run: |
        echo "🔍 Validating pushed images..."
        # Verify images were pushed successfully by checking if they can be pulled
        docker pull okteto/movies-with-helm:api || (echo "❌ API image validation failed" && exit 1)
        docker pull okteto/movies-with-helm:frontend || (echo "❌ Frontend image validation failed" && exit 1)
        echo "✅ Images validated successfully - both images can be pulled from registry"

    - name: Summary
      if: success()
      run: |
        echo "🎉 Build and push completed successfully!"
        echo "📦 Built images:"
        echo "  - okteto/movies-with-helm:api"
        echo "  - okteto/movies-with-helm:api-${{ github.sha }}"
        echo "  - okteto/movies-with-helm:frontend"  
        echo "  - okteto/movies-with-helm:frontend-${{ github.sha }}"