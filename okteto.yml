icon: https://apps.okteto.com/movies/icon.png

build:
  api:
    context: api
  frontend:
    context: frontend

deploy:
  - envsubst < chart/values.yaml > chart/values-processed.yaml
  - helm upgrade --install movies chart -f chart/values-processed.yaml

dev:
  api:
    command: yarn start
    sync:
      - api:/src
    forward:
      - 9229:9229

  frontend:
    image: okteto/node:14
    command: bash
    sync:
      - frontend:/usr/src/app
